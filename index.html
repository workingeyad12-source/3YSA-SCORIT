<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة سيكوريت العيسي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1a1a1a; --accent: #c5a059; --bg: #fdfbf7; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; padding-top: 80px; }
        header { background: white; padding: 15px 5%; position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 100; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; }
        .card { background: white; padding: 10px; border-radius: 10px; cursor: pointer; border: 1px solid #eee; }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; width: 90%; max-width: 400px; border-radius: 10px; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; cursor: pointer; margin-top: 10px; border-radius: 5px; }
        .sidebar { position: fixed; top: 0; right: -100%; width: 300px; height: 100%; background: white; padding: 20px; transition: 0.4s; z-index: 2000; box-shadow: -5px 0 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <header>
        <h3>سيكوريت العيسي</h3>
        <button onclick="document.getElementById('sidebar').style.right='0'">السلة (<span id="cartCount">0</span>)</button>
    </header>

    <div class="grid" id="grid"></div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="mTitle"></h3>
            <div id="sizes"></div>
            <button class="btn" onclick="addToCart()">إضافة للسلة</button>
            <button class="btn" style="background:#666" onclick="document.getElementById('modal').style.display='none'">إغلاق</button>
        </div>
    </div>

    <div id="sidebar" class="sidebar">
        <h3>سلة الطلبات</h3>
        <div id="cartItems"></div>
        <input type="text" id="uName" placeholder="الاسم" style="width:100%; padding:10px; margin:5px 0;">
        <input type="tel" id="uPhone" placeholder="رقم الموبايل" style="width:100%; padding:10px; margin:5px 0;">
        <button class="btn" onclick="sendOrder()">تأكيد الطلب</button>
        <button class="btn" style="background:#ff4757" onclick="document.getElementById('sidebar').style.right='-100%'">إغلاق</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
            apiKey: "AIzaSyA7Qq047XakFRq_azxj9UdyvrQuFaPGQvk",
            projectId: "ysa-46de8"
        }));

        const products = [
            { id: 1, title: "جرار اسباني سيكوريت", img: "5.jpg", price: 9500 },
            { id: 2, title: "كابينة فرنسي", img: "6.jpg", price: 10500 }
        ];

        let cart = [];
        let selectedProduct = null;

        // عرض المنتجات
        const grid = document.getElementById('grid');
        products.forEach(p => {
            let div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `<img src="${p.img}"><h4>${p.title}</h4>`;
            div.onclick = () => { selectedProduct = p; document.getElementById('mTitle').innerText = p.title; document.getElementById('modal').style.display = 'flex'; };
            grid.appendChild(div);
        });

        // إضافة للسلة
        window.addToCart = () => {
            cart.push(selectedProduct);
            document.getElementById('cartCount').innerText = cart.length;
            document.getElementById('modal').style.display = 'none';
            alert("تمت الإضافة!");
        };

        // إرسال الطلب
        window.sendOrder = async () => {
            await addDoc(collection(db, "orders"), {
                name: document.getElementById('uName').value,
                phone: document.getElementById('uPhone').value,
                cart: cart,
                time: new Date()
            });
            alert("تم استلام طلبك بنجاح!");
            document.getElementById('sidebar').style.right = '-100%';
        };
    </script>
</body>
</html>
